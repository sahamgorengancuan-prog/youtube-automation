[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sias"
version = "0.1.0"
description = "Scientific Illustrated Audio Studio — image-first audiovisual storytelling (stills + narration, never video-first)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "PyYAML>=6.0", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
notebooks = ["nbformat>=5.9", "jupyter"]

[project.scripts]
sias = "sias.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
